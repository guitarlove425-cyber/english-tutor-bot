services:
  - type: web
    name: english-tutor-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: DAILY_FREE_LIMIT
        value: "5"
